<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Rhoodstone — More Than A Stone</title>
<style>
:root{--bg:#080a0d;--panel:#11151b;--line:#252b34;--text:#f3f5f7;--muted:#8e98a6;--green:#b8ff4a;--green2:#8edb25;--danger:#ff6b6b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 75% 10%,#18220e 0,#080a0d 32%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif}a{color:inherit;text-decoration:none}button,input,textarea{font:inherit}.wrap{max-width:1180px;margin:auto;padding:0 22px}.nav{height:78px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{font-weight:900;letter-spacing:.16em}.navright{display:flex;gap:10px;align-items:center}.btn{border:1px solid var(--line);background:#10141a;color:#fff;padding:12px 18px;border-radius:12px;cursor:pointer;font-weight:750}.btn:hover{border-color:#46505d}.primary{background:var(--green);border-color:var(--green);color:#071000}.hero{min-height:610px;display:grid;grid-template-columns:1fr 1fr;gap:45px;align-items:center;padding:65px 0}.eyebrow{font-size:12px;letter-spacing:.18em;color:var(--green);font-weight:800}.hero h1{font-size:clamp(58px,8vw,105px);line-height:.9;margin:18px 0 24px;letter-spacing:-.06em}.lead{font-size:19px;line-height:1.7;color:var(--muted);max-width:600px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}.art{border:1px solid var(--line);border-radius:22px;overflow:hidden;background:#0d1015;box-shadow:0 30px 80px #0008}.art img{display:block;width:100%;height:auto}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding-bottom:80px}.card,.panel{background:linear-gradient(180deg,#12171e,#0e1217);border:1px solid var(--line);border-radius:16px;padding:24px}.card h3{margin:14px 0 8px}.muted{color:var(--muted);line-height:1.65}.tag{font-size:11px;color:var(--green);font-weight:800;letter-spacing:.12em}.page{padding:55px 0 90px}.page h1{font-size:52px;margin:10px 0}.page h2{margin-top:38px}.notice{padding:15px 17px;border:1px solid #35411f;background:#12190d;border-radius:12px;color:#dce8cc;margin:20px 0}.campaignGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.reward{font-size:28px;font-weight:900;margin:20px 0;color:var(--green)}.row{display:flex;justify-content:space-between;gap:20px;padding:14px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.formGrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.formGrid label,label{display:flex;flex-direction:column;gap:8px;color:#cdd3dc;font-weight:700}.full{grid-column:1/-1}input,textarea{background:#090c10;border:1px solid var(--line);border-radius:10px;padding:12px;color:#fff;outline:none}input:focus,textarea:focus{border-color:var(--green)}.footer{border-top:1px solid var(--line);padding:25px 0 40px;color:#68717d;font-size:13px}.modalBack{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:20px;z-index:50}.modal{width:min(500px,100%);background:#12171e;border:1px solid #37404c;border-radius:18px;padding:28px;box-shadow:0 30px 100px #000}.modal h2{margin-top:0}.menu{position:relative}.menuItems{position:absolute;right:0;top:48px;width:190px;background:#12171e;border:1px solid var(--line);border-radius:12px;padding:7px;z-index:10}.menuItems button{display:block;width:100%;text-align:left;background:none;border:0;color:#fff;padding:11px;border-radius:8px;cursor:pointer}.menuItems button:hover{background:#1b222b}.empty{border:1px dashed #343b45;border-radius:14px;padding:35px;text-align:center;color:var(--muted)}.error{color:#ff9c9c}.ok{color:var(--green)}@media(max-width:850px){.hero{grid-template-columns:1fr;padding-top:40px}.cards,.campaignGrid{grid-template-columns:1fr}.formGrid{grid-template-columns:1fr}.full{grid-column:auto}.hero h1{font-size:65px}}
</style>
</head>
<body>
<div class="wrap"><header class="nav"><a class="brand" href="#home">RHOODSTONE</a><div id="navRight" class="navright"></div></header><div id="app"></div><footer class="footer">Rhoodstone Holder Utility • Robinhood Chain • Contract <span id="contractText"></span></footer></div>
<div id="modalRoot"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script>
<script>
const CONTRACT='0x6be906e10351B4a970521c386E89D9e4e34c47C9',CHAIN_ID=4663,CHAIN_HEX='0x1237',RPC='https://rpc.mainnet.chain.robinhood.com',EXPLORER='https://robinhoodchain.blockscout.com';
const SUPABASE_URL='https://arsriflrliftvpbtzuwt.supabase.co',SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXAiLCJyb2xlIjoiYW5vbiJ9.-tQ45VyKygjvfea_8lISo_4PDkxjoYa9bUXLsDMA1SU';
const OPENSEA='https://opensea.io/collection/rhood-stone/activity';
// The Supabase URL/key are public client credentials; RLS must protect database writes.
const sb=window.supabase?.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);let wallet=null;
try{wallet=JSON.parse(sessionStorage.getItem('rhood_verified')||'null')?.address||null}catch(e){}
document.getElementById('contractText').textContent=CONTRACT.slice(0,6)+'…'+CONTRACT.slice(-4);
function short(a){return a?a.slice(0,6)+'…'+a.slice(-4):''}function save(a){wallet=a;sessionStorage.setItem('rhood_verified',JSON.stringify({address:a}))}function clear(){wallet=null;sessionStorage.removeItem('rhood_verified')}
function modal(title,text,html){document.getElementById('modalRoot').innerHTML='<div class="modalBack"><div class="modal"><h2>'+title+'</h2><p class="muted">'+text+'</p>'+(html||'<button class="btn primary" onclick="closeModal()">Close</button>')+'</div></div>'}function closeModal(){document.getElementById('modalRoot').innerHTML=''}
async function rpc(method,params=[]){const r=await fetch(RPC,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method,params})});const j=await r.json();if(j.error)throw Error(j.error.message||'RPC error');return j.result}
async function balanceOf(a){const data='0x70a08231'+a.slice(2).toLowerCase().padStart(64,'0');return BigInt(await rpc('eth_call',[{to:CONTRACT,data},'latest']))}
async function switchChain(){if(!window.ethereum)throw Error('No Web3 wallet detected. Install MetaMask or another EVM wallet.');try{await window.ethereum.request({method:'wallet_switchEthereumChain',params:[{chainId:CHAIN_HEX}]})}catch(e){if(e.code!==4902)throw e;await window.ethereum.request({method:'wallet_addEthereumChain',params:[{chainId:CHAIN_HEX,chainName:'Robinhood Chain',nativeCurrency:{name:'Robinhood',symbol:'RHL',decimals:18},rpcUrls:[RPC],blockExplorerUrls:[EXPLORER]}]})}}
async function connect(){try{await switchChain();const accts=await window.ethereum.request({method:'eth_requestAccounts'});const a=accts?.[0];if(!a)throw Error('No wallet account returned.');const b=await balanceOf(a);if(b===0n){modal('Not a Rhoodstone holder','This wallet does not currently hold a Rhoodstone NFT.','<div class="actions"><a class="btn primary" target="_blank" href="'+OPENSEA+'">Buy on OpenSea</a><button class="btn" onclick="closeModal()">Close</button></div>');return}save(a);renderNav();modal('Holder verified','Your Rhoodstone NFT was verified successfully.','<button class="btn primary" onclick="closeModal();location.hash=\'#dashboard\'">Go to Dashboard</button>')}catch(e){modal('Connection failed',e.message||'Wallet connection failed.')}}
async function verify(){if(!wallet||!window.ethereum)return false;try{const accts=await window.ethereum.request({method:'eth_accounts'});if(!accts?.[0]||accts[0].toLowerCase()!==wallet.toLowerCase()){clear();return false}await switchChain();const b=await balanceOf(wallet);if(b===0n){clear();location.hash='#home';modal('Access removed','This wallet no longer holds a Rhoodstone NFT.');return false}return true}catch(e){return false}}
function renderNav(){const n=document.getElementById('navRight');n.innerHTML=wallet?'<span class="tag">'+short(wallet)+'</span><div class="menu"><button class="btn" onclick="toggleMenu()">•••</button><div id="menuItems" class="menuItems" style="display:none"><button onclick="location.hash=\'#dashboard\';toggleMenu()">Dashboard</button><button onclick="location.hash=\'#submit\';toggleMenu()">Submit Project</button><button onclick="disconnect()">Disconnect</button></div></div>':'<a class="btn" target="_blank" href="https://x.com/rhoodstone">X / Twitter</a>'}function toggleMenu(){const x=document.getElementById('menuItems');if(x)x.style.display=x.style.display==='none'?'block':'none'}function disconnect(){clear();location.hash='#home';renderNav()}
async function home(){document.getElementById('app').innerHTML='<main><section class="hero"><div><div class="eyebrow">ROBINHOOD CHAIN • HOLDER UTILITY</div><h1>More Than<br>A Stone.</h1><p class="lead">Rhoodstone holders get access to exclusive GTD campaigns from partner NFT projects. Verify once and enter your private holder dashboard.</p><div class="actions"><button class="btn primary" onclick="connect()">Connect & Verify</button><a class="btn" target="_blank" href="https://x.com/rhoodstone">Follow on X</a></div></div><div class="art"><img src="assets/hero-banner.jpg" alt="Rhoodstone"></div></section><section class="cards"><div class="card"><span class="tag">01</span><h3>Verify</h3><p class="muted">NFT ownership is checked directly on Robinhood Chain.</p></div><div class="card"><span class="tag">02</span><h3>Open Campaigns</h3><p class="muted">Verified holders see campaigns approved by the Rhoodstone admin.</p></div><div class="card"><span class="tag">03</span><h3>Claim Rewards</h3><p class="muted">Eligible GTD or points are reserved and tracked per wallet.</p></div></section></main>'}
async function dashboard(){if(!await verify()){location.hash='#home';return}document.getElementById('app').innerHTML='<main class="page"><div class="eyebrow">PRIVATE HOLDER AREA</div><h1>Holder Dashboard</h1><p class="muted">Only a currently verified Rhoodstone holder can use this page.</p><div class="notice">✓ Holder verified: '+short(wallet)+'</div><h2>Active Campaigns</h2><div id="campaigns"><p class="muted">Loading campaigns…</p></div><h2>My Wallet</h2><div class="panel"><div class="row"><span>Wallet</span><strong>'+short(wallet)+'</strong></div><div class="row"><span>Rhoodstone contract</span><span class="tag">'+short(CONTRACT)+'</span></div></div></main>';loadCampaigns()}
async function loadCampaigns(){const box=document.getElementById('campaigns');try{const {data,error}=await sb.from('campaigns').select('*').eq('status','live').order('created_at',{ascending:false});if(error)throw error;if(!data?.length){box.innerHTML='<div class="empty">No live campaigns right now.</div>';return}box.innerHTML='<div class="campaignGrid">'+data.map(c=>'<div class="panel"><span class="tag">LIVE</span><h3>'+esc(c.name)+'</h3><p class="muted">'+esc(c.description||'')+'</p><div class="reward">'+Number(c.gtd_pool||0)+' GTD</div><button class="btn primary" onclick="openCampaign(\''+c.id+'\')">Open Box</button></div>').join('')+'</div>'}catch(e){box.innerHTML='<div class="notice error">Campaigns could not be loaded. Check that the Supabase schema/RLS is installed correctly.<br><small>'+esc(e.message||'')+'</small></div>'}}
async function openCampaign(id){try{const {data,error}=await sb.rpc('open_campaign_box',{p_campaign_id:id,p_wallet:wallet});if(error)throw error;const r=data?.[0]||data;modal(r?.reward_type==='gtd'?'GTD Assigned':r?.reward_type==='points'?'Points Assigned':'Better Luck',r?.message||'Reward result recorded.')}catch(e){modal('Could not open campaign',e.message||'Claim failed.')}}
function submit(){if(!wallet){location.hash='#home';return}document.getElementById('app').innerHTML='<main class="page"><div class="eyebrow">PARTNER SUBMISSION</div><h1>Submit a GTD</h1><p class="muted">Project owners can submit an allocation. Admin approval is required.</p><form class="panel" onsubmit="sendSubmission(event)"><div class="formGrid"><label>Project Name<input name="project_name" required></label><label>Website<input name="website"></label><label>Blockchain<input name="chain"></label><label>GTD Quantity<input name="gtd_quantity" type="number" min="0" required></label><label>Claim Method<input name="claim_method"></label><label>Claim Link<input name="claim_link"></label><label>Expiry<input name="expiry" type="date"></label><label>Contact<input name="contact"></label><label class="full">Instructions<textarea name="instructions" rows="5"></textarea></label></div><div class="actions"><button class="btn primary">Submit for Review</button></div><p id="submitMsg" class="muted"></p></form></main>'}
async function sendSubmission(e){e.preventDefault();const f=new FormData(e.target);const row=Object.fromEntries(f.entries());row.gtd_quantity=Number(row.gtd_quantity||0);row.submitted_by=wallet;row.status='pending';if(row.expiry){row.expiry=`${row.expiry}T23:59:59+06:00`;}try{const {error}=await sb.from('project_submissions').insert(row);if(error)throw error;document.getElementById('submitMsg').textContent='Submitted. Admin review is required before publication.';e.target.reset()}catch(x){document.getElementById('submitMsg').textContent=x.message||'Submission failed.'}}
function admin(){document.getElementById('app').innerHTML='<main class="page"><div class="panel" style="max-width:520px;margin:60px auto"><div class="eyebrow">ADMIN</div><h1>Sign in</h1><form onsubmit="adminLogin(event)"><label>Email<input id="ae" type="email" required></label><br><label>Password<input id="ap" type="password" required></label><br><button class="btn primary">Sign in</button></form><p id="am" class="muted"></p></div></main>'}
async function adminLogin(e){e.preventDefault();const {data,error}=await sb.auth.signInWithPassword({email:document.getElementById('ae').value,password:document.getElementById('ap').value});if(error){document.getElementById('am').textContent=error.message;return}document.getElementById('am').textContent='Signed in. Admin UI is ready once your RLS/admin policies are configured.'}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function render(){renderNav();const r=location.hash.replace('#','').split('?')[0]||'home';if(r==='dashboard')return dashboard();if(r==='submit')return submit();if(r==='admin')return admin();return home()}
window.addEventListener('hashchange',render);if(window.ethereum){window.ethereum.on?.('accountsChanged',()=>{clear();render()});window.ethereum.on?.('chainChanged',()=>{if(location.hash==='#dashboard'||location.hash==='#submit')render()})}setInterval(async()=>{if(wallet&&location.hash==='#dashboard'){if(!(await verify())){location.hash='#home';render()}}},30000);render();
</script>
</body></html>
