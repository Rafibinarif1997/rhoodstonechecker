<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#070a07">
<title>Rhood Stone — Eligibility</title>
<style>
*{box-sizing:border-box}
:root{
 --bg:#050705;--stone:#77756c;--stone2:#3a3b34;--stone3:#1b1d18;
 --ink:#d7d1c2;--muted:#9c998e;--green:#79ff45;--green2:#b2ff93;
}
html{scroll-behavior:smooth}
body{
 margin:0;background:var(--bg);color:var(--ink);
 font-family:Georgia,"Times New Roman",serif;
}
body:before{
 content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;
 background:
 radial-gradient(circle at 50% 15%,rgba(83,255,55,.09),transparent 30%),
 linear-gradient(180deg,#020302 0%,#071007 55%,#020302 100%);
}
.page{width:min(1280px,96vw);margin:auto;padding-bottom:50px}
.cover{
 position:relative;overflow:hidden;margin-top:8px;border:2px solid #252920;
 border-radius:18px;box-shadow:0 18px 55px #000;
 background:#030403;
}
.cover img{display:block;width:100%;height:auto;aspect-ratio:1280/480;object-fit:cover;display:block}
.cover:after{
 content:"";position:absolute;inset:0;
 background:linear-gradient(180deg,transparent 45%,rgba(2,4,2,.42) 100%);
 pointer-events:none;
}
.logo{
 position:absolute;z-index:2;left:50%;bottom:-48px;transform:translateX(-50%);
 width:138px;height:138px;object-fit:contain;border-radius:50%;
 background:#020302;border:5px solid #36382f;
 box-shadow:0 0 0 3px #11130f,0 15px 35px #000,0 0 35px rgba(92,255,55,.2);
}
.hero-spacer{height:82px;text-align:center}
.hero-title{
 margin:0;font-size:clamp(38px,6vw,66px);line-height:1;
 letter-spacing:2px;text-transform:uppercase;font-weight:900;
 color:#b9b3a5;text-shadow:3px 4px 0 #171814,0 0 18px rgba(100,255,70,.14);
}
.tag{
 margin:10px 0 0;color:#b1ad9f;font-size:clamp(14px,2vw,19px);
 letter-spacing:2px;font-weight:700;
}
.slab{
 max-width:820px;margin:30px auto 0;padding:28px;
 border:3px solid #35372f;border-radius:20px;
 background:linear-gradient(145deg,#65635b 0%,#292b25 35%,#11130f 100%);
 box-shadow:0 22px 55px #000,inset 0 2px 0 rgba(255,255,255,.18),inset 0 -6px 0 rgba(0,0,0,.48);
}
.slab h2{
 margin:0 0 20px;text-align:center;text-transform:uppercase;
 font-size:clamp(24px,4vw,36px);letter-spacing:2px;color:#d0cabb;
 text-shadow:2px 3px 0 #22231f,0 -1px 0 #f0eadc;
}
.label{
 display:block;margin:0 0 9px;text-transform:uppercase;letter-spacing:1.5px;
 font-weight:900;font-size:14px;color:#c6c0b1;
}
.input{
 width:100%;height:60px;padding:0 17px;border-radius:12px;
 border:3px solid #34362f;background:#0d100c;color:#e2dccd;
 font:700 16px Georgia,serif;outline:none;box-shadow:inset 0 5px 12px #000;
}
.input:focus{border-color:#65785b;box-shadow:0 0 0 2px rgba(121,255,69,.13),inset 0 5px 12px #000}
.input::placeholder{color:#6e6e67}
.btn{
 width:100%;height:60px;margin-top:14px;border:3px solid #34362f;border-radius:12px;
 background:linear-gradient(#aaa79b,#716f66 52%,#454640);
 color:#282a24;font:900 17px Georgia,serif;letter-spacing:1px;text-transform:uppercase;
 cursor:pointer;box-shadow:inset 0 2px 0 #e0dbcf,inset 0 -5px 0 #272923,0 8px 18px #000;
 text-shadow:0 1px 0 #ded9cb;transition:.15s;
}
.btn:hover{filter:brightness(1.12);transform:translateY(-1px)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.6;cursor:wait}
.submit{background:linear-gradient(#a9c69b,#708462 52%,#465443);border-color:#52604d}
.result{
 display:none;margin-top:16px;padding:18px;border-radius:12px;border:3px solid #35372f;
 background:linear-gradient(145deg,#22251f,#0c0e0b);box-shadow:inset 0 2px 0 rgba(255,255,255,.08),inset 0 -4px #000;
 text-align:center;
}
.result.show{display:block}
.result h3{margin:0 0 6px;font-size:26px;letter-spacing:1px;color:#d1cbbd}
.result p{margin:0;color:#a9a59a;font-size:15px}
.result.ok h3{color:#b9ec9e}
.hint{text-align:center;color:#77776f;font-size:12px;margin:13px 0 0;letter-spacing:.5px}
.inscriptions{
 display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:820px;margin:20px auto 0;
}
.inscription{
 padding:22px;text-align:center;border:2px solid #272a24;border-radius:13px;
 background:linear-gradient(145deg,#20231d,#0b0d0a);
 color:#96948a;font-weight:700;letter-spacing:1.5px;line-height:1.6;
 box-shadow:0 12px 30px #000;
}
.footer{text-align:center;margin-top:30px;color:#76756d;letter-spacing:2px;font-weight:700}
@media(max-width:650px){
 .page{width:96vw}.cover{margin-top:8px;border-radius:11px}
 .logo{width:108px;height:108px;bottom:-36px;border-width:4px}.hero-spacer{height:66px}
 .slab{padding:20px 15px;border-radius:15px}.inscriptions{grid-template-columns:1fr}
 .hero-title{font-size:37px}.tag{font-size:13px;letter-spacing:1px}
}
.spinner{display:inline-block;width:15px;height:15px;border:2px solid #4a4c43;border-top-color:#111;border-radius:50%;vertical-align:-2px;margin-right:7px;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== RHOOD STONE — FULL STONE TEXT SYSTEM ===== */
:root{
 --stone-light:#f4efe1;
 --stone-mid:#a9a398;
 --stone-dark:#34342f;
 --green:#7cff45;
}

/* Every visible text element gets an engraved/rock-carved appearance */
body, body *{
 font-family:Georgia,"Times New Roman",serif;
}

.hero-title,.tag,.slab h2,.label,.btn,.result h3,.result p,
.hint,.inscription,.footer{
 text-rendering:geometricPrecision;
}

/* Main carved title */
.hero-title{
 color:#e9e3d5 !important;
 font-weight:900;
 letter-spacing:2.5px;
 -webkit-text-stroke:1px #24251f;
 text-shadow:
   0 2px 0 #fff7e5,
   0 4px 0 #aaa59a,
   0 6px 0 #55544d,
   0 8px 0 #191a16,
   0 10px 16px rgba(0,0,0,.9),
   0 0 18px rgba(124,255,69,.13);
 filter:contrast(1.08);
}

/* Stone/carved subtitle */
.tag{
 color:#e5dfd1 !important;
 font-weight:800;
 letter-spacing:1.8px;
 text-shadow:
   0 1px 0 #fff8e9,
   0 2px 0 #858278,
   0 3px 0 #292a25,
   0 5px 8px #000;
}

/* Main stone slab typography */
.slab h2{
 color:#fff8e9 !important;
 font-weight:900;
 letter-spacing:2px;
 -webkit-text-stroke:.7px #22231f;
 text-shadow:
   0 1px 0 #fffdf4,
   0 3px 0 #aaa59a,
   0 5px 0 #54534b,
   0 7px 0 #1b1c18,
   0 9px 10px #000;
}

/* Labels are also physically engraved into the stone */
.label{
 color:#eee8da !important;
 font-weight:900;
 letter-spacing:1.5px;
 text-shadow:
   0 1px 0 #fff8e8,
   0 2px 0 #77756c,
   0 3px 0 #191a16,
   0 4px 5px #000;
}

/* Stone buttons */
.btn{
 color:#f7f2e5 !important;
 font-weight:900;
 letter-spacing:1.2px;
 -webkit-text-stroke:.35px #20211d;
 text-shadow:
   0 1px 0 #fffdf5,
   0 3px 0 #817e73,
   0 5px 0 #3a3a34,
   0 7px 0 #11120f,
   0 8px 7px #000 !important;
}

/* Result text */
.result h3{
 color:#fff8e9 !important;
 font-weight:900;
 text-shadow:
   0 1px 0 #fffdf6,
   0 3px 0 #8b887e,
   0 5px 0 #292a25,
   0 7px 8px #000;
}
.result.ok h3{
 color:#baff9b !important;
 text-shadow:
   0 1px 0 #efffdf,
   0 3px 0 #65865b,
   0 5px 0 #192218,
   0 0 12px rgba(124,255,69,.25);
}
.result p{
 color:#e8e2d4 !important;
 text-shadow:0 2px 0 #20211d,0 4px 6px #000;
}

/* Small text is still stone-carved, but kept readable */
.hint,.footer{
 color:#d8d2c4 !important;
 font-weight:700;
 text-shadow:
   0 1px 0 #f8f2e5,
   0 2px 0 #69675f,
   0 4px 5px #000;
}
.inscription{
 color:#eee8d9 !important;
 font-weight:900;
 text-shadow:
   0 1px 0 #fffaf0,
   0 3px 0 #817e73,
   0 5px 0 #282923,
   0 7px 8px #000;
}

/* Input text: bright engraved stone look */
.input{
 color:#fffdf5 !important;
 font-family:Georgia,"Times New Roman",serif !important;
 font-weight:900 !important;
 text-shadow:0 1px 0 #fff,0 2px 0 #393a34;
}
.input::placeholder{
 color:#aaa79c !important;
 text-shadow:0 1px 0 #222;
}

/* Stone texture overlay on the whole UI */
.slab,.inscription,.btn,.result{
 position:relative;
 overflow:hidden;
}
.slab:before,.inscription:before,.btn:before,.result:before{
 content:"";
 position:absolute;
 inset:0;
 pointer-events:none;
 opacity:.17;
 background-image:
   repeating-linear-gradient(117deg,rgba(255,255,255,.18) 0 1px,transparent 1px 17px),
   repeating-linear-gradient(23deg,rgba(0,0,0,.20) 0 1px,transparent 1px 13px);
 mix-blend-mode:overlay;
}
.slab > *, .inscription > *, .btn > *, .result > *{
 position:relative;
 z-index:1;
}

</style>
</head>
<body>
<div class="page">
 <section class="cover">
   <img src="./assets/cover.jpg" alt="Rhood Stone">
   <img class="logo" src="./assets/logo.png" alt="Rhood Stone stone emblem">
 </section>

 <div class="hero-spacer">
   <h1 class="hero-title">Rhood Stone</h1>
   <p class="tag">The chain moves forward. The stone remembers.</p>
 </div>

 <section class="slab">
   <h2>Check Your Eligibility</h2>
   <label class="label" for="wallet">Wallet Address</label>
   <input id="wallet" class="input" placeholder="0x..." autocomplete="off" spellcheck="false">
   <button id="check" class="btn">Check Eligibility</button>
   <button id="submit" class="btn submit" style="display:none">Submit Address</button>
   <div id="result" class="result"></div>
   <div class="hint">Only eligible wallets can submit their address.</div>
 </section>

 <section class="inscriptions">
   <div class="inscription">BUILT BY THE EARLY<br>FOR A BIGGER TOMORROW</div>
   <div class="inscription">MORE THAN A STONE<br>THE STONE REMEMBERS</div>
 </section>

 <footer class="footer">FORGED FOR THE EARLY • PRESERVED ON-CHAIN</footer>
</div>

<script>
const SUPABASE_FUNCTION_URL = "YOUR_SUPABASE_FUNCTION_URL";
const wallet = document.getElementById("wallet");
const checkBtn = document.getElementById("check");
const submitBtn = document.getElementById("submit");
const result = document.getElementById("result");
let eligibleAddress = null;

const valid = a => /^0x[a-fA-F0-9]{40}$/.test(a);

function show(kind,title,msg){
 result.className = "result show " + kind;
 result.innerHTML = "<h3>"+title+"</h3><p>"+msg+"</p>";
}

async function request(action,address){
 const r = await fetch(SUPABASE_FUNCTION_URL,{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({action,address})
 });
 const data = await r.json().catch(()=>({}));
 if(!r.ok) throw new Error(data.error || "Request failed");
 return data;
}

async function checkEligibility(){
 const address=wallet.value.trim();
 submitBtn.style.display="none"; eligibleAddress=null; result.className="result";
 if(!valid(address)){show("bad","Invalid Address","Please enter a valid EVM wallet address.");return}
 if(SUPABASE_FUNCTION_URL.includes("YOUR_")){
   show("bad","Backend Not Configured","Add your Supabase Edge Function URL in index.html first.");return
 }
 checkBtn.disabled=true;checkBtn.innerHTML='<span class="spinner"></span>Checking...';
 try{
   const data=await request("check",address);
   if(data.eligible){
     eligibleAddress=address;
     show("ok","Eligible ✓","This wallet qualifies for Rhood Stone.");
     submitBtn.style.display="block";
   }else show("bad","Not Eligible","This wallet does not currently qualify.");
 }catch(e){show("bad","Check Failed",e.message)}
 finally{checkBtn.disabled=false;checkBtn.textContent="Check Eligibility"}
}

async function submitAddress(){
 if(!eligibleAddress)return;
 submitBtn.disabled=true;submitBtn.innerHTML='<span class="spinner"></span>Submitting...';
 try{
   const data=await request("submit",eligibleAddress);
   if(data.submitted){
     submitBtn.style.display="none";
     show("ok","Address Submitted ✓","Your wallet address has been submitted successfully.");
   }else{
     eligibleAddress=null;submitBtn.style.display="none";
     show("bad","Not Eligible","This wallet no longer qualifies.");
   }
 }catch(e){show("bad","Submission Failed",e.message)}
 finally{submitBtn.disabled=false;submitBtn.textContent="Submit Address"}
}

checkBtn.onclick=checkEligibility;
submitBtn.onclick=submitAddress;
wallet.addEventListener("keydown",e=>{if(e.key==="Enter")checkEligibility()});
</script>
</body>
</html>
