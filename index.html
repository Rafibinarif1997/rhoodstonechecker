<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rhood Stone — Eligibility</title>
<meta name="theme-color" content="#050505">
<style>
:root{
  --green:#b8ff00;
  --bg:#050505;
  --card:rgba(12,12,12,.82);
  --border:rgba(184,255,0,.22);
  --muted:#8c8c8c;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at 50% 35%, rgba(184,255,0,.08), transparent 32%),
    var(--bg);
  color:#fff;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
.hero{
  width:100%;
  height:220px;
  background:
    linear-gradient(180deg,rgba(0,0,0,.15),rgba(5,5,5,.9)),
    url("assets/cover.png") center/cover no-repeat;
  border-bottom:1px solid rgba(184,255,0,.15);
}
.wrap{
  width:min(92%,560px);
  margin:-62px auto 50px;
  position:relative;
}
.brand{
  text-align:center;
}
.logo{
  width:82px;
  height:82px;
  object-fit:cover;
  border-radius:22px;
  border:3px solid #0a0a0a;
  box-shadow:0 0 35px rgba(184,255,0,.25);
  background:#b8ff00;
}
h1{
  margin:14px 0 4px;
  font-size:34px;
  letter-spacing:.02em;
}
.tagline{
  margin:0 0 26px;
  color:#aaa;
  font-size:14px;
}
.card{
  background:var(--card);
  backdrop-filter:blur(14px);
  border:1px solid var(--border);
  border-radius:22px;
  padding:26px;
  box-shadow:0 20px 70px rgba(0,0,0,.45);
}
.label{
  display:block;
  color:#cfcfcf;
  font-size:13px;
  margin-bottom:9px;
}
.input-row{
  display:flex;
  gap:10px;
}
input{
  flex:1;
  min-width:0;
  height:52px;
  border-radius:13px;
  border:1px solid #2c2c2c;
  background:#080808;
  color:#fff;
  padding:0 15px;
  font-size:14px;
  outline:none;
}
input:focus{
  border-color:var(--green);
  box-shadow:0 0 0 3px rgba(184,255,0,.08);
}
button{
  height:52px;
  padding:0 20px;
  border:0;
  border-radius:13px;
  background:var(--green);
  color:#050505;
  font-weight:800;
  cursor:pointer;
  white-space:nowrap;
}
button:disabled{opacity:.55;cursor:wait}
.status{
  min-height:24px;
  margin-top:18px;
  text-align:center;
  font-size:14px;
}
.result{
  display:none;
  margin-top:16px;
  border-radius:16px;
  padding:22px;
  text-align:center;
}
.result.show{display:block}
.result.eligible{
  background:rgba(184,255,0,.09);
  border:1px solid rgba(184,255,0,.35);
}
.result.no{
  background:rgba(255,255,255,.035);
  border:1px solid rgba(255,255,255,.1);
}
.result .big{
  font-size:25px;
  font-weight:900;
  margin-bottom:6px;
}
.result p{margin:0;color:#aaa;font-size:13px}
.footer{
  text-align:center;
  margin-top:18px;
  color:#666;
  font-size:11px;
}
@media(max-width:520px){
  .hero{height:185px}
  .wrap{margin-top:-48px}
  .card{padding:20px}
  .input-row{flex-direction:column}
  button{width:100%}
  h1{font-size:29px}
}
</style>
</head>
<body>
<div class="hero"></div>

<main class="wrap">
  <div class="brand">
    <img class="logo" src="assets/logo.png" alt="Rhood Stone">
    <h1>Rhood Stone</h1>
    <p class="tagline">The chain moves forward. The stone remembers.</p>
  </div>

  <section class="card">
    <label class="label" for="wallet">Wallet address</label>
    <div class="input-row">
      <input id="wallet" type="text" inputmode="text"
             placeholder="0x..." autocomplete="off" spellcheck="false">
      <button id="checkBtn">Check</button>
    </div>

    <div id="status" class="status"></div>

    <div id="result" class="result">
      <div id="resultTitle" class="big"></div>
      <p id="resultText"></p>
    </div>

    <div class="footer">Robinhood Chain • Rhood Stone</div>
  </section>
</main>

<script>
/*
  IMPORTANT:
  Never put your Blockscout API key in this file.
  Set API_URL to your deployed backend/Cloudflare Worker URL.
*/
const API_URL = "YOUR_BACKEND_URL";

const walletInput = document.getElementById("wallet");
const checkBtn = document.getElementById("checkBtn");
const statusEl = document.getElementById("status");
const resultEl = document.getElementById("result");
const resultTitle = document.getElementById("resultTitle");
const resultText = document.getElementById("resultText");

function validAddress(v){
  return /^0x[a-fA-F0-9]{40}$/.test(v.trim());
}

function showResult(eligible){
  resultEl.className = "result show " + (eligible ? "eligible" : "no");
  resultTitle.textContent = eligible ? "Eligible ✓" : "Not Eligible";
  resultText.textContent = eligible
    ? "This wallet qualifies for Rhood Stone."
    : "This wallet does not currently qualify.";
}

async function checkWallet(){
  const address = walletInput.value.trim();

  resultEl.className = "result";
  statusEl.textContent = "";

  if(!validAddress(address)){
    statusEl.textContent = "Enter a valid EVM wallet address.";
    return;
  }

  if(API_URL === "YOUR_BACKEND_URL"){
    statusEl.textContent = "Backend URL is not configured yet.";
    return;
  }

  checkBtn.disabled = true;
  checkBtn.textContent = "Checking...";
  statusEl.textContent = "";

  try{
    const res = await fetch(API_URL + "?address=" + encodeURIComponent(address), {
      method: "GET",
      headers: { "Accept": "application/json" }
    });

    const data = await res.json();

    if(!res.ok || typeof data.eligible !== "boolean"){
      throw new Error("Invalid backend response");
    }

    showResult(data.eligible);
  }catch(err){
    statusEl.textContent = "Unable to check right now. Please try again.";
  }finally{
    checkBtn.disabled = false;
    checkBtn.textContent = "Check";
  }
}

checkBtn.addEventListener("click", checkWallet);
walletInput.addEventListener("keydown", e => {
  if(e.key === "Enter") checkWallet();
});
</script>
</body>
</html>
