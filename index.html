<style>
:root{--bg:#050806;--panel:#0a100c;--panel2:#0d1510;--line:#1d2a20;--text:#f5f8f4;--muted:#8c998e;--green:#b8ff3d;--green2:#7dca21;--gold:#ffd33d;--blue:#42c8ff;--purple:#c16bff;--red:#ff7272;--shadow:0 30px 90px rgba(0,0,0,.48)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 75% 0%,#13200f 0,#071009 26%,#050806 55%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.12;background-image:linear-gradient(rgba(184,255,61,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(184,255,61,.12) 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(to bottom,#000,transparent 80%)}a{color:inherit;text-decoration:none}button,input,textarea,select{font:inherit}.wrap{max-width:1280px;margin:auto;padding:0 24px}.nav{height:82px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(5,8,6,.82);backdrop-filter:blur(18px);z-index:20}.brand{display:flex;align-items:center;gap:11px;font-weight:950;letter-spacing:.15em}.brandMark{width:34px;height:34px;border:2px solid var(--green);border-radius:9px;display:grid;place-items:center;color:var(--green);font-weight:950;box-shadow:0 0 28px #b8ff3d25}.links{display:flex;gap:28px;color:#aab4aa;font-size:14px;font-weight:700}.links a:hover,.links a.active{color:var(--green)}.navright{display:flex;gap:10px;align-items:center}.btn{border:1px solid var(--line);background:#0b110d;color:#fff;padding:12px 17px;border-radius:11px;cursor:pointer;font-weight:800;transition:.2s}.btn:hover{transform:translateY(-1px);border-color:#4b664f}.btn.primary{background:var(--green);border-color:var(--green);color:#061000;box-shadow:0 0 35px #b8ff3d20}.btn.primary:hover{box-shadow:0 0 45px #b8ff3d40}.walletTag{border:1px solid #30412f;background:#0b130d;padding:10px 13px;border-radius:11px;font-weight:800;color:#dce7dc}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green);margin-right:7px}
.hero{min-height:670px;display:grid;grid-template-columns:1.03fr .97fr;gap:48px;align-items:center;padding:72px 0}.eyebrow{font-size:11px;letter-spacing:.2em;color:var(--green);font-weight:900}.hero h1{font-size:clamp(62px,8.3vw,112px);line-height:.84;letter-spacing:-.07em;margin:18px 0 25px}.hero h1 span{color:var(--green);text-shadow:0 0 40px #b8ff3d25}.lead{font-size:18px;line-height:1.75;color:var(--muted);max-width:600px}.actions{display:flex;gap:11px;flex-wrap:wrap;margin-top:28px}.visual{position:relative;border:1px solid #26362a;border-radius:25px;overflow:hidden;background:#0b120d;box-shadow:var(--shadow)}.visual img{display:block;width:100%;height:auto}.visual:after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(184,255,61,.08),transparent 45%,rgba(0,0,0,.25))}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-top:25px}.stat,.card,.panel{background:linear-gradient(180deg,rgba(14,22,16,.94),rgba(8,13,10,.94));border:1px solid var(--line);border-radius:16px}.stat{padding:17px}.stat b{display:block;font-size:23px}.stat span{color:var(--muted);font-size:12px}
.section{padding:70px 0}.sectionHead{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:24px}.title{font-size:42px;letter-spacing:-.04em;margin:8px 0}.muted{color:var(--muted);line-height:1.65}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{padding:25px}.card .num{color:var(--green);font-weight:950;letter-spacing:.12em}.card h3{margin:14px 0 8px}
.page{padding:48px 0 90px}.pageTitle{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:28px}.page h1{font-size:52px;letter-spacing:-.05em;margin:8px 0}.verified{border:1px solid #314a2b;background:linear-gradient(90deg,#0d1a0b,#0a110b);padding:14px 17px;border-radius:13px;color:#dcebd5}.dashboardGrid{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:18px}.campaignHero{position:relative;min-height:420px;overflow:hidden;border:1px solid #293b2c;border-radius:22px;background:radial-gradient(circle at 50% 42%,#193218,transparent 44%),#08100a;display:grid;place-items:center;text-align:center;padding:30px}.campaignHero:before{content:"";position:absolute;width:420px;height:420px;border-radius:50%;background:#b8ff3d14;filter:blur(45px)}.campaignBadge{position:relative;z-index:1;border:1px solid #4c6d35;color:var(--green);padding:8px 13px;border-radius:999px;font-size:11px;font-weight:900;letter-spacing:.13em}.campaignHero h2{position:relative;z-index:1;font-size:55px;letter-spacing:-.06em;margin:15px 0 8px}.boxArt{position:relative;z-index:1;width:180px;height:140px;margin:15px auto 24px;border:2px solid #607e42;border-radius:18px;background:linear-gradient(145deg,#172519,#080e0a);display:grid;place-items:center;box-shadow:0 0 75px #b8ff3d25, inset 0 0 40px #b8ff3d10}.boxArt:before{content:"";width:82px;height:58px;border:3px solid var(--green);border-radius:12px;transform:skewY(-3deg);box-shadow:0 0 24px #b8ff3d35}.boxArt span{position:absolute;font-size:35px;font-weight:950;color:var(--green)}.openBtn{position:relative;z-index:1;min-width:260px;font-size:17px;padding:15px 25px}.side{display:grid;gap:16px}.panel{padding:22px}.panelTitle{display:flex;justify-content:space-between;gap:15px;align-items:center}.panel h3{margin:0}.countdown{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:16px}.time{background:#0b120e;border:1px solid var(--line);border-radius:10px;padding:10px 4px;text-align:center}.time b{display:block;font-size:20px}.time span{font-size:9px;color:var(--muted);text-transform:uppercase}.progress{height:9px;background:#152019;border-radius:99px;overflow:hidden;margin:13px 0 5px}.progress i{display:block;height:100%;width:48%;background:var(--green);box-shadow:0 0 18px #b8ff3d60}.rewardGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-top:18px}.reward{padding:24px;border-radius:18px;border:1px solid var(--line);min-height:210px;background:#090e0b}.reward.gold{border-color:#675a1e;background:linear-gradient(180deg,#171505,#0a0d09)}.reward.blue{border-color:#17485c;background:linear-gradient(180deg,#07151d,#090e0b)}.reward.purple{border-color:#49245d;background:linear-gradient(180deg,#140a19,#090e0b)}.rewardIcon{font-size:30px}.reward h3{font-size:23px;margin:12px 0 4px}.reward small{color:var(--muted)}.reward .miniBtn{margin-top:18px;width:100%;padding:10px;border-radius:9px;border:1px solid var(--line);background:#101713;color:#fff;font-weight:800}.gold .miniBtn{background:var(--gold);color:#171200;border-color:var(--gold)}.blue .miniBtn{color:var(--blue);border-color:#245d72}.purple .miniBtn{color:var(--purple);border-color:#63337c}.results{margin-top:18px}.resultRow{display:grid;grid-template-columns:1.2fr .8fr 1fr;padding:14px 0;border-bottom:1px solid var(--line);font-size:13px}.resultRow:last-child{border:0}.resultType{font-weight:900}.gtd{color:var(--gold)}.points{color:var(--blue)}.luck{color:var(--purple)}
.empty{border:1px dashed #334138;border-radius:16px;padding:45px;text-align:center;color:var(--muted)}.formGrid{display:grid;grid-template-columns:1fr 1fr;gap:17px}.formGrid label,label{display:flex;flex-direction:column;gap:8px;color:#d5ddd5;font-weight:750;font-size:13px}.full{grid-column:1/-1}input,textarea,select{background:#080d0a;border:1px solid var(--line);border-radius:10px;padding:12px;color:#fff;outline:none}input:focus,textarea:focus,select:focus{border-color:var(--green)}.menu{position:relative}.menuItems{position:absolute;right:0;top:49px;width:190px;background:#0b120e;border:1px solid var(--line);border-radius:12px;padding:7px;z-index:30;box-shadow:var(--shadow)}.menuItems button{display:block;width:100%;text-align:left;background:none;border:0;color:#fff;padding:11px;border-radius:8px;cursor:pointer}.menuItems button:hover{background:#152019}.notice{padding:15px;border:1px solid #31432c;background:#0c160b;border-radius:12px}.error{color:#ffaaaa}.footer{border-top:1px solid var(--line);padding:28px 0 45px;color:#647066;font-size:12px;display:flex;justify-content:space-between;gap:15px}.modalBack{position:fixed;inset:0;background:rgba(0,0,0,.78);display:grid;place-items:center;padding:20px;z-index:100}.modal{width:min(520px,100%);background:#0c130f;border:1px solid #334535;border-radius:20px;padding:28px;box-shadow:0 30px 120px #000}.modal h2{margin-top:0;font-size:28px}.modalReward{text-align:center;padding:20px 0}.modalReward .big{font-size:58px;font-weight:950;color:var(--green);text-shadow:0 0 35px #b8ff3d35}.adminTable{width:100%;border-collapse:collapse}.adminTable th,.adminTable td{padding:13px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.adminTable th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}.adminActions{display:flex;gap:7px;flex-wrap:wrap}.status{display:inline-block;padding:5px 9px;border:1px solid var(--line);border-radius:999px;font-size:10px;font-weight:900;text-transform:uppercase}
@media(max-width:950px){.links{display:none}.hero{grid-template-columns:1fr}.dashboardGrid{grid-template-columns:1fr}.rewardGrid,.cards{grid-template-columns:1fr}.pageTitle{align-items:start;flex-direction:column}.side{grid-template-columns:1fr 1fr}.campaignHero h2{font-size:42px}}
@media(max-width:650px){.wrap{padding:0 15px}.nav{height:70px}.brand{font-size:13px}.walletTag{font-size:11px}.hero{padding:45px 0}.hero h1{font-size:65px}.stats{grid-template-columns:1fr}.side{grid-template-columns:1fr}.formGrid{grid-template-columns:1fr}.full{grid-column:auto}.resultRow{grid-template-columns:1fr;gap:5px}.footer{flex-direction:column}.page h1{font-size:40px}}
</style>

<body>
<div class="wrap">
<header class="nav">
<a class="brand" href="#home"><span class="brandMark">R</span> RHOODSTONE</a>
<nav class="links" id="links"><a href="#home">Home</a><a href="#dashboard">Campaigns</a><a href="#myboxes">My Boxes</a><a href="#leaderboard">Leaderboard</a></nav>
<div id="navRight" class="navright"></div>
</header>
<div id="app"></div>
<footer class="footer"><span>RHOODSTONE • MORE THAN A STONE</span><span>Robinhood Chain • 4663 • <span id="contractText"></span></span></footer>
</div>
<div id="modalRoot"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script>
<script>
const CONTRACT='0x6be906e10351B4a970521c386E89D9e4e34c47C9';
const CHAIN_ID=4663,CHAIN_HEX='0x1237',RPC='https://rpc.mainnet.chain.robinhood.com',EXPLORER='https://robinhoodchain.blockscout.com';
const SUPABASE_URL='https://arsriflrliftvpbtzuwt.supabase.co',SUPABASE_ANON_KEY='sb_publishable_qauOa_OQyDuicj2iGj_8yQ_GyGH5jbo';
const OPENSEA='https://opensea.io/collection/rhood-stone/activity';
const sb=window.supabase?.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);let wallet=null;let lastResults=JSON.parse(localStorage.getItem('rhood_results')||'[]');
try{wallet=JSON.parse(sessionStorage.getItem('rhood_verified')||'null')?.address||null}catch(e){}
document.getElementById('contractText').textContent=CONTRACT.slice(0,6)+'…'+CONTRACT.slice(-4);
function short(a){return a?a.slice(0,6)+'…'+a.slice(-4):''}function save(a){wallet=a;sessionStorage.setItem('rhood_verified',JSON.stringify({address:a}))}function clear(){wallet=null;sessionStorage.removeItem('rhood_verified')}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function modal(title,text,html){document.getElementById('modalRoot').innerHTML='<div class="modalBack"><div class="modal"><h2>'+title+'</h2><p class="muted">'+text+'</p>'+(html||'<div class="actions"><button class="btn primary" onclick="closeModal()">Close</button></div>')+'</div></div>'}function closeModal(){document.getElementById('modalRoot').innerHTML=''}
async function rpc(method,params=[]){const r=await fetch(RPC,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method,params})});const j=await r.json();if(j.error)throw Error(j.error.message||'RPC error');return j.result}
async function balanceOf(a){const data='0x70a08231'+a.slice(2).toLowerCase().padStart(64,'0');return BigInt(await rpc('eth_call',[{to:CONTRACT,data},'latest']))}
async function switchChain(){if(!window.ethereum)throw Error('No Web3 wallet detected. Install MetaMask or another compatible wallet.');try{await window.ethereum.request({method:'wallet_switchEthereumChain',params:[{chainId:CHAIN_HEX}]})}catch(e){if(e.code!==4902)throw e;await window.ethereum.request({method:'wallet_addEthereumChain',params:[{chainId:CHAIN_HEX,chainName:'Robinhood Chain',nativeCurrency:{name:'Robinhood',symbol:'RHL',decimals:18},rpcUrls:[RPC],blockExplorerUrls:[EXPLORER]}]})}}
async function connect(){try{await switchChain();const accts=await window.ethereum.request({method:'eth_requestAccounts'});const a=accts?.[0];if(!a)throw Error('No wallet account returned.');const b=await balanceOf(a);if(b===0n){modal('Not a Rhoodstone holder','This wallet currently holds no Rhoodstone NFT.','<div class="actions"><a class="btn primary" target="_blank" href="'+OPENSEA+'">View on OpenSea</a><button class="btn" onclick="closeModal()">Close</button></div>');return}save(a);renderNav();modal('Holder verified','Your Rhoodstone NFT was verified successfully.','<div class="actions"><button class="btn primary" onclick="closeModal();location.hash=\'#dashboard\'">Enter Dashboard</button></div>')}catch(e){modal('Connection failed',e.message||'Wallet connection failed.')}}
async function verify(){if(!wallet||!window.ethereum)return false;try{const accts=await window.ethereum.request({method:'eth_accounts'});if(!accts?.[0]||accts[0].toLowerCase()!==wallet.toLowerCase()){clear();return false}await switchChain();const b=await balanceOf(wallet);if(b===0n){clear();location.hash='#home';modal('Access removed','This wallet no longer holds a Rhoodstone NFT.');return false}return true}catch(e){return false}}
function renderNav(){const n=document.getElementById('navRight');n.innerHTML=wallet?'<span class="walletTag"><i class="dot"></i>'+short(wallet)+'</span><div class="menu"><button class="btn" onclick="toggleMenu()">•••</button><div id="menuItems" class="menuItems" style="display:none"><button onclick="location.hash=\'#dashboard\';toggleMenu()">Dashboard</button><button onclick="location.hash=\'#myboxes\';toggleMenu()">My Boxes</button><button onclick="location.hash=\'#submit\';toggleMenu()">Submit Project</button><button onclick="disconnect()">Disconnect</button></div></div>':'<a class="btn" target="_blank" href="https://x.com/rhoodstone">X / Twitter</a>'}function toggleMenu(){const x=document.getElementById('menuItems');if(x)x.style.display=x.style.display==='none'?'block':'none'}function disconnect(){clear();location.hash='#home';renderNav()}
function home(){document.getElementById('app').innerHTML='<main><section class="hero"><div><div class="eyebrow">ROBINHOOD CHAIN • HOLDER UTILITY</div><h1>MORE THAN<br><span>A STONE.</span></h1><p class="lead">Rhoodstone turns verified NFT ownership into a simple holder experience: discover partner GTD campaigns, open your box and claim the rewards you earn.</p><div class="actions"><button class="btn primary" onclick="connect()">Connect & Verify</button><a class="btn" target="_blank" href="https://x.com/rhoodstone">Follow on X</a></div><div class="stats"><div class="stat"><b>4663</b><span>Robinhood Chain</span></div><div class="stat"><b>1 NFT</b><span>Holder access</span></div><div class="stat"><b>GTD</b><span>Partner rewards</span></div></div></div><div class="visual"><img src="assets/hero-banner.jpg" alt="Rhoodstone"></div></section><section class="section"><div class="sectionHead"><div><div class="eyebrow">HOW IT WORKS</div><h2 class="title">Hold. Open. Win.</h2></div></div><div class="cards"><div class="card"><span class="num">01</span><h3>Verify</h3><p class="muted">Connect your wallet and ownership is checked directly on Robinhood Chain.</p></div><div class="card"><span class="num">02</span><h3>Open Campaigns</h3><p class="muted">Verified holders get access to approved partner campaigns and their reward pools.</p></div><div class="card"><span class="num">03</span><h3>Claim</h3><p class="muted">GTD allocations and other rewards are recorded against your holder experience.</p></div></div></section></main>'}
async function dashboard(){if(!await verify()){location.hash='#home';return}document.getElementById('app').innerHTML='<main class="page"><div class="pageTitle"><div><div class="eyebrow">PRIVATE HOLDER AREA</div><h1>Open Your Box</h1><p class="muted">One verified wallet. One box per campaign.</p></div><div class="verified">✓ Holder verified: <b>'+short(wallet)+'</b></div></div><div id="campaignArea"><div class="empty">Loading live campaigns…</div></div></main>';loadCampaigns()}
async function loadCampaigns(){const box=document.getElementById('campaignArea');try{const {data,error}=await sb.from('campaigns').select('*').eq('status','live').order('created_at',{ascending:false});if(error)throw error;if(!data?.length){box.innerHTML='<div class="empty">No live campaigns right now.<br>Check back when a partner campaign is published.</div>';return}const c=data[0];box.innerHTML='<div class="dashboardGrid"><section><div class="campaignHero"><span class="campaignBadge">LIVE GTD CAMPAIGN</span><div><h2>'+esc(c.name||'Partner Campaign')+'</h2><p class="muted">'+esc(c.description||'Open your reward box. Your result is recorded securely for this campaign.')+'</p><div class="boxArt"><span>R</span></div><button class="btn primary openBtn" onclick="openCampaign(\''+c.id+'\',this)">▣ &nbsp; OPEN BOX</button><p class="muted" style="font-size:12px;margin:12px 0 0">One box per wallet</p></div></div><div class="rewardGrid"><div class="reward gold"><div class="rewardIcon">🏆</div><h3>GTD</h3><small>Guaranteed allocation</small><p class="muted">Win a guaranteed spot in the partner project.</p><button class="miniBtn">Claim after win</button></div><div class="reward blue"><div class="rewardIcon">✦</div><h3>Points</h3><small>Reward points</small><p class="muted">Collect points for future holder benefits.</p><button class="miniBtn">Reward points</button></div><div class="reward purple"><div class="rewardIcon">♣</div><h3>Better Luck</h3><small>Not this time</small><p class="muted">No GTD in this box. Keep holding for the next campaign.</p><button class="miniBtn">Next campaign</button></div></div><div class="panel results"><div class="panelTitle"><h3>Recent Results</h3><a class="muted" href="#myboxes">View all →</a></div>'+renderResults()+'</div></section><aside class="side"><div class="panel"><div class="panelTitle"><h3>Campaign Ends In</h3><span class="tag">LIVE</span></div><div class="countdown"><div class="time"><b>12</b><span>Days</span></div><div class="time"><b>08</b><span>Hours</span></div><div class="time"><b>24</b><span>Min</span></div><div class="time"><b>16</b><span>Sec</span></div></div></div><div class="panel"><div class="panelTitle"><h3>Boxes Opened</h3><b>48 / 100</b></div><div class="progress"><i></i></div><small class="muted">48% of campaign boxes opened</small></div><div class="panel"><h3>Reward Pool</h3><div class="row" style="display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line)"><span>GTD</span><b style="color:var(--gold)">'+Number(c.gtd_pool||20)+'</b></div><div class="row" style="display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line)"><span>Points</span><b style="color:var(--blue)">30</b></div><div class="row" style="display:flex;justify-content:space-between;padding:13px 0"><span>Better Luck</span><b style="color:var(--purple)">50</b></div></div><div class="panel"><h3>Campaign Info</h3><p class="muted" style="font-size:12px">Contract<br><b>'+short(CONTRACT)+'</b></p><p class="muted" style="font-size:12px">Chain<br><b>Robinhood Chain (4663)</b></p><a class="btn" target="_blank" href="'+EXPLORER+'/address/'+CONTRACT+'">View Contract ↗</a></div></aside></div>'}catch(e){box.innerHTML='<div class="notice error">Campaigns could not be loaded.<br><small>'+esc(e.message||'')+'</small></div>'}}
function renderResults(){if(!lastResults.length)return '<div class="empty" style="margin-top:16px">No boxes opened yet.</div>';return lastResults.slice(0,5).map(r=>'<div class="resultRow"><span>'+esc(r.date)+'</span><span class="resultType '+(r.type==='gtd'?'gtd':r.type==='points'?'points':'luck')+'">'+esc(r.label)+'</span><span>'+esc(r.message||'Reward result recorded')+'</span></div>').join('')}
async function openCampaign(id,btn){try{if(btn){btn.disabled=true;btn.textContent='OPENING…'}const {data,error}=await sb.rpc('open_campaign_box',{p_campaign_id:id,p_wallet:wallet});if(error)throw error;const r=data?.[0]||data||{};const type=r?.reward_type||'better_luck';const label=type==='gtd'?'GTD':type==='points'?'Points':'Better Luck';lastResults.unshift({date:new Date().toLocaleString(),type,label,message:r?.message||'Reward result recorded.'});lastResults=lastResults.slice(0,20);localStorage.setItem('rhood_results',JSON.stringify(lastResults));const big=type==='gtd'?'GTD':type==='points'?'+100':'♣';const action=type==='gtd'&&r?.claim_link?'<a class="btn primary" target="_blank" href="'+esc(r.claim_link)+'">Claim GTD ↗</a>':'<button class="btn primary" onclick="closeModal()">View My Boxes</button>';modal(label,type==='gtd'?'Congratulations — your GTD allocation has been assigned.':type==='points'?'You earned reward points from this campaign.':'No GTD this time — better luck next campaign!','<div class="modalReward"><div class="big">'+big+'</div></div><div class="actions">'+action+'</div>')}catch(e){modal('Could not open campaign',e.message||'Claim failed.')}finally{if(btn){btn.disabled=false;btn.textContent='▣   OPEN BOX'}}}
function myboxes(){if(!wallet){location.hash='#home';return}document.getElementById('app').innerHTML='<main class="page"><div class="eyebrow">HOLDER HISTORY</div><h1>My Boxes</h1><p class="muted">Rewards recorded for this browser session and wallet.</p><div class="panel" style="margin-top:24px">'+(lastResults.length?renderResults():'<div class="empty">You have not opened a box yet.</div>')+'</div></main>'}
function leaderboard(){document.getElementById('app').innerHTML='<main class="page"><div class="eyebrow">COMMUNITY</div><h1>Leaderboard</h1><p class="muted">A simple points board for future holder campaigns.</p><div class="panel" style="margin-top:24px"><div class="resultRow"><b>#</b><b>Holder</b><b>Points</b></div><div class="resultRow"><span>01</span><span>0x3a…9f2e</span><b style="color:var(--blue)">1,250</b></div><div class="resultRow"><span>02</span><span>0x81…c421</span><b style="color:var(--blue)">980</b></div><div class="resultRow"><span>03</span><span>0x54…19aa</span><b style="color:var(--blue)">760</b></div><p class="muted" style="font-size:12px;margin-bottom:0">Leaderboard rewards are not active until the corresponding campaign rules are configured.</p></div></main>'}
function submit(){if(!wallet){location.hash='#home';return}document.getElementById('app').innerHTML='<main class="page"><div class="eyebrow">PARTNER SUBMISSION</div><h1>Submit a GTD</h1><p class="muted">Project owners can submit an allocation. Admin approval is required.</p><form class="panel" style="margin-top:25px" onsubmit="sendSubmission(event)"><div class="formGrid"><label>Project Name<input name="project_name" required></label><label>Website<input name="website"></label><label>Blockchain<input name="chain"></label><label>GTD Quantity<input name="gtd_quantity" type="number" min="0" required></label><label>Claim Method<input name="claim_method"></label><label>Claim Link<input name="claim_link"></label><label>Expiry<input name="expiry" type="date"></label><label>Contact<input name="contact"></label><label class="full">Instructions<textarea name="instructions" rows="5"></textarea></label></div><div class="actions"><button class="btn primary">Submit for Review</button></div><p id="submitMsg" class="muted"></p></form></main>'}
async function sendSubmission(e){e.preventDefault();const f=new FormData(e.target);const row=Object.fromEntries(f.entries());row.gtd_quantity=Number(row.gtd_quantity||0);row.submitted_by=wallet;row.status='pending';if(row.expiry)row.expiry=row.expiry+'T23:59:59+06:00';try{const {error}=await sb.from('project_submissions').insert(row);if(error)throw error;document.getElementById('submitMsg').textContent='Submitted. Admin review is required before publication.';e.target.reset()}catch(x){document.getElementById('submitMsg').textContent=x.message||'Submission failed.'}}
async function admin(){const {data}=await sb.auth.getSession();if(!data?.session){document.getElementById('app').innerHTML='<main class="page"><div class="panel" style="max-width:520px;margin:60px auto"><div class="eyebrow">RHOODSTONE ADMIN</div><h1>Sign in</h1><p class="muted">Admin access uses Supabase Auth.</p><form onsubmit="adminLogin(event)"><label>Email<input id="ae" type="email" required></label><br><label>Password<input id="ap" type="password" required></label><br><button class="btn primary">Sign in</button></form><p id="am" class="muted"></p></div></main>';return}renderAdmin()}
async function adminLogin(e){e.preventDefault();const {error}=await sb.auth.signInWithPassword({email:document.getElementById('ae').value,password:document.getElementById('ap').value});if(error){document.getElementById('am').textContent=error.message;return}renderAdmin()}
async function renderAdmin(){const {data,error}=await sb.auth.getUser();if(error||!data?.user){await sb.auth.signOut();location.hash='#admin';return}const email=esc(data.user.email||'');document.getElementById('app').innerHTML='<main class="page"><div class="eyebrow">ADMIN PANEL</div><h1>Rhoodstone Admin</h1><p class="muted">Signed in as '+email+'</p><div class="actions"><button class="btn primary" onclick="adminSubmissions()">Submissions</button><button class="btn" onclick="adminCampaigns()">Campaigns</button><button class="btn" onclick="adminNewCampaign()">New Campaign</button><button class="btn" onclick="adminLogout()">Sign out</button></div><div id="adminBody" style="margin-top:22px"><p class="muted">Loading…</p></div></main>';adminSubmissions()}
async function adminSubmissions(){const box=document.getElementById('adminBody');if(!box)return;box.innerHTML='<p class="muted">Loading submissions…</p>';const {data,error}=await sb.from('project_submissions').select('*').order('created_at',{ascending:false});if(error){box.innerHTML='<div class="notice error">'+esc(error.message)+'</div>';return}if(!data?.length){box.innerHTML='<div class="empty">No submissions.</div>';return}box.innerHTML='<div class="panel"><table class="adminTable"><thead><tr><th>Project</th><th>GTD</th><th>Status</th><th>Actions</th></tr></thead><tbody>'+data.map(x=>'<tr><td><strong>'+esc(x.project_name||'')+'</strong><br><small class="muted">'+esc(x.website||'')+'</small></td><td>'+Number(x.gtd_quantity||0)+'</td><td><span class="status">'+esc(x.status||'pending')+'</span></td><td><div class="adminActions">'+(x.status!=='approved'?'<button class="btn primary" onclick="approveSubmission(\''+x.id+'\')">Approve</button>':'')+(x.status!=='rejected'?'<button class="btn" onclick="rejectSubmission(\''+x.id+'\')">Reject</button>':'')+'</div></td></tr>').join('')+'</tbody></table></div>'}
async function approveSubmission(id){const {error}=await sb.from('project_submissions').update({status:'approved'}).eq('id',id);if(error){modal('Approval failed',error.message);return}adminSubmissions()}async function rejectSubmission(id){const {error}=await sb.from('project_submissions').update({status:'rejected'}).eq('id',id);if(error){modal('Rejection failed',error.message);return}adminSubmissions()}
async function adminCampaigns(){const box=document.getElementById('adminBody');if(!box)return;box.innerHTML='<p class="muted">Loading campaigns…</p>';const {data,error}=await sb.from('campaigns').select('*').order('created_at',{ascending:false});if(error){box.innerHTML='<div class="notice error">'+esc(error.message)+'</div>';return}if(!data?.length){box.innerHTML='<div class="empty">No campaigns yet.</div>';return}box.innerHTML='<div class="panel"><table class="adminTable"><thead><tr><th>Name</th><th>GTD Pool</th><th>Status</th><th>Actions</th></tr></thead><tbody>'+data.map(x=>'<tr><td><strong>'+esc(x.name||'')+'</strong><br><small class="muted">'+esc(x.description||'')+'</small></td><td>'+Number(x.gtd_pool||0)+'</td><td><span class="status">'+esc(x.status||'')+'</span></td><td><div class="adminActions">'+(x.status==='live'?'<button class="btn" onclick="setCampaignStatus(\''+x.id+'\',\'paused\')">Pause</button>':'<button class="btn primary" onclick="setCampaignStatus(\''+x.id+'\',\'live\')">Publish</button>')+'</div></td></tr>').join('')+'</tbody></table></div>'}
async function setCampaignStatus(id,status){const {error}=await sb.from('campaigns').update({status}).eq('id',id);if(error){modal('Update failed',error.message);return}adminCampaigns()}
function adminNewCampaign(){document.getElementById('adminBody').innerHTML='<div class="panel"><h2>Create Campaign</h2><form onsubmit="createCampaign(event)"><div class="formGrid"><label>Name<input id="cn" required></label><label>GTD Pool<input id="cg" type="number" min="0" required></label><label class="full">Description<textarea id="cd" rows="4"></textarea></label><label>Status<select id="cs"><option value="live">Live</option><option value="draft">Draft</option></select></label></div><div class="actions"><button class="btn primary">Create Campaign</button></div><p id="cm" class="muted"></p></form></div>'}
async function createCampaign(e){e.preventDefault();const row={name:document.getElementById('cn').value,description:document.getElementById('cd').value,gtd_pool:Number(document.getElementById('cg').value||0),status:document.getElementById('cs').value};const {error}=await sb.from('campaigns').insert(row);if(error){document.getElementById('cm').textContent=error.message;return}adminCampaigns()}
async function adminLogout(){await sb.auth.signOut();location.hash='#admin';render()}
function render(){renderNav();const r=location.hash.replace('#','').split('?')[0]||'home';if(r==='dashboard')return dashboard();if(r==='myboxes')return myboxes();if(r==='leaderboard')return leaderboard();if(r==='submit')return submit();if(r==='admin')return admin();return home()}
window.addEventListener('hashchange',render);if(window.ethereum){window.ethereum.on?.('accountsChanged',()=>{clear();render()});window.ethereum.on?.('chainChanged',()=>{if(location.hash==='#dashboard'||location.hash==='#myboxes'||location.hash==='#submit')render()})}setInterval(async()=>{if(wallet&&(location.hash==='#dashboard'||location.hash==='#myboxes')){if(!(await verify())){location.hash='#home';render()}}},30000);render();
</script>
</body>
