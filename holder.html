<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Holder Area — Rhoodstone</title><style>
:root{--bg:#050705;--panel:#0b100a;--line:#263321;--muted:#899486;--text:#f3f6ed;--lime:#a5ff3f}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#1a2b0e,#050705 45%);color:var(--text);font-family:Inter,system-ui,Arial}.top{height:76px;border-bottom:1px solid #20291c;display:flex;align-items:center;justify-content:space-between;padding:0 5%;background:#050705cc;backdrop-filter:blur(18px)}.brand{display:flex;align-items:center;gap:12px;font-weight:900;letter-spacing:3px}.brand img{width:38px;height:38px;border-radius:9px}.back{color:#aeb7a8;font-size:13px}.back:hover{color:var(--lime)}main{width:min(1000px,92%);margin:auto;padding:90px 0}.eyebrow{color:var(--lime);font-size:10px;font-weight:900;letter-spacing:4px;text-align:center}.title{text-align:center;font:clamp(48px,8vw,86px)/.9 Georgia,serif;margin:16px 0}.sub{text-align:center;color:var(--muted);line-height:1.8;max-width:620px;margin:auto}.gate{margin:45px auto 18px;max-width:760px;padding:20px;border:1px solid #30412a;border-radius:16px;background:#090e08;text-align:center}.ok{color:#d5ffad}.bad{color:#ffb4b4}.cards{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:15px}.card{border:1px solid var(--line);background:linear-gradient(145deg,#10160e,#080b08);border-radius:20px;padding:28px}.label{color:#778170;font-size:10px;letter-spacing:2px;font-weight:800}.value{font-size:20px;font-weight:800;margin-top:12px;word-break:break-all}.nft{font:58px Georgia,serif;color:var(--lime);margin-top:8px}.actions{display:flex;justify-content:center;gap:12px;margin-top:28px}.btn{border:1px solid #52604b;border-radius:11px;padding:12px 17px;background:#080b08;color:#eef3e9;cursor:pointer}.btn.primary{border-color:var(--lime);background:#10200a;color:#dfffbe}.hidden{display:none}@media(max-width:650px){.cards{grid-template-columns:1fr}.actions{flex-direction:column}.actions>*{width:100%}.top{padding:0 16px}}
</style></head><body><header class="top"><a class="brand" href="index.html"><img src="assets/rhoodstone-stone.jpg">RHOODSTONE</a><a class="back" href="index.html">← Back Home</a></header><main><div class="eyebrow">PRIVATE HOLDER EXPERIENCE</div><h1 class="title">Holder Area</h1><p class="sub">Your wallet session from the homepage is used here. No second wallet connection is required.</p><div id="gate" class="gate">Checking holder access…</div><div id="content" class="hidden"><div class="cards"><div class="card"><div class="label">CONNECTED WALLET</div><div class="value" id="address">—</div></div><div class="card"><div class="label">RHOODSTONE NFTs</div><div class="nft" id="balance">—</div></div></div><div class="actions"><button class="btn primary" id="refresh">Refresh Status</button><a class="btn" href="index.html">Back Home</a></div></div></main><script type="module">import{BrowserProvider,Contract}from"https://cdn.jsdelivr.net/npm/ethers@6.15.0/+esm";const CONTRACT="0x6be906e10351B4a970521c386E89D9e4e34c47C9",CHAIN_ID=4663n,ABI=["function balanceOf(address owner) view returns (uint256)"];const gate=document.getElementById("gate"),content=document.getElementById("content"),addr=document.getElementById("address"),balEl=document.getElementById("balance");async function verify(){content.classList.add("hidden");gate.className="gate";gate.textContent="Checking holder access…";const account=localStorage.getItem("rhoodstone_account");if(!account){gate.innerHTML='Please connect and verify your wallet from the <a href="index.html" style="color:#a5ff3f">homepage</a> first.';return}try{if(!window.ethereum)throw Error("Open this page in the same wallet/browser used on the homepage.");const p=new BrowserProvider(window.ethereum),n=await p.getNetwork();if(n.chainId!==CHAIN_ID){gate.className="gate bad";gate.textContent="Wrong network. Switch to Robinhood Chain Mainnet (Chain ID 4663).";return}const bal=await new Contract(CONTRACT,ABI,p).balanceOf(account);if(bal>0n){addr.textContent=account;balEl.textContent=bal.toString();gate.className="gate ok";gate.innerHTML="✓ Holder access verified on-chain";content.classList.remove("hidden")}else{gate.className="gate bad";gate.textContent="Holder access denied — this wallet currently holds no Rhoodstone NFT."}}catch(e){gate.className="gate bad";gate.textContent="⚠ "+(e.shortMessage||e.message||"Could not verify holder access.")}}document.getElementById("refresh").onclick=verify;verify();</script></body></html>
