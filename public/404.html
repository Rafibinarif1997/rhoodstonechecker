<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <title>RhoodStone</title>

  <script>
    const path = window.location.pathname;

    if (path !== "/" && path !== "/index.html") {
      sessionStorage.setItem("rhoodstone_redirect", path);
      window.location.replace("/");
    }
  </script>
</head>

<body>
  <div id="root"></div>
</body>
</html>
